<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" overflow="visible">
  <defs>
    <linearGradient id="mSoup-u29" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF6A8"/>
      <stop offset="40%" stop-color="#FFD400"/>
      <stop offset="100%" stop-color="#E89400"/>
    </linearGradient>
    <linearGradient id="mBowl-u30" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#C9D6F5"/>
    </linearGradient>
    <linearGradient id="mPlus-u27" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4C8CFF"/>
      <stop offset="100%" stop-color="#1A56D8"/>
    </linearGradient>
    <filter id="mGlow-u28" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- splash + droplets (behind / above the rim) -->
  <g class="splash" filter="url(#mGlow-u28)">
    <path fill="url(#mSoup-u29)" stroke="#fff" stroke-width="10" stroke-linejoin="round"
      d="M150 128 C 200 70, 250 40, 330 48 C 370 52, 378 88, 348 96 C 300 108, 250 90, 200 128 C 230 70, 300 78, 320 70"/>
    <path fill="url(#mSoup-u29)" d="M150 128 C 210 60, 280 36, 338 52 C 365 62, 358 92, 328 94 C 280 98, 230 86, 185 128 Z"/>
    <path fill="#FFF3A0" opacity=".7" d="M210 78 C 250 52, 300 50, 330 62 C 310 58, 260 70, 220 90 Z"/>
    <circle cx="250" cy="28" r="22" fill="url(#mSoup-u29)" stroke="#fff" stroke-width="7"/>
    <circle cx="250" cy="28" r="22" fill="url(#mSoup-u29)"/>
    <ellipse cx="240" cy="18" rx="8" ry="10" fill="#fff" opacity=".85"/>
    <circle cx="292" cy="22" r="10" fill="url(#mSoup-u29)" stroke="#fff" stroke-width="4"/>
    <ellipse cx="288" cy="18" rx="3.2" ry="4" fill="#fff" opacity=".85"/>
  </g>

  <!-- fat white then navy outline of the bowl -->
  <path d="M46 150 C 46 128, 86 118, 210 118 C 334 118, 374 128, 374 150
           C 378 168, 378 200, 350 248 C 320 300, 100 300, 70 248
           C 42 200, 42 168, 46 150 Z"
        fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
  <path d="M46 150 C 46 128, 86 118, 210 118 C 334 118, 374 128, 374 150
           C 378 168, 378 200, 350 248 C 320 300, 100 300, 70 248
           C 42 200, 42 168, 46 150 Z"
        fill="url(#mBowl-u30)" stroke="#0A2F8C" stroke-width="5" stroke-linejoin="round"/>

  <!-- soup surface inside the bowl -->
  <path d="M62 152 C 90 126, 330 126, 358 154 C 320 148, 100 146, 62 152 Z" fill="url(#mSoup-u29)"/>
  <path d="M90 140 C 160 122, 300 124, 340 146 C 280 136, 160 134, 90 140 Z" fill="#FFF3A0" opacity=".65"/>

  <!-- plus button -->
  <g transform="translate(108,200)" fill="url(#mPlus-u27)">
    <path d="M-10-28 h20 a6 6 0 0 1 6 6 v16 h16 a6 6 0 0 1 6 6 v20 a6 6 0 0 1-6 6 h-16 v16 a6 6 0 0 1-6 6 h-20 a6 6 0 0 1-6-6 v-16 h-16 a6 6 0 0 1-6-6 v-20 a6 6 0 0 1 6-6 h16 v-16 a6 6 0 0 1 6-6 z"/>
  </g>

  <!-- face buttons -->
  <g fill="#1A56D8">
    <circle cx="292" cy="176" r="10"/>
    <circle cx="274" cy="194" r="10"/>
    <circle cx="310" cy="194" r="10"/>
    <circle cx="292" cy="212" r="10"/>
  </g>

  <!-- happy eyes + smile -->
  <g fill="none" stroke="#0A2F8C" stroke-width="8" stroke-linecap="round">
    <path d="M176 198 q 12 -14 24 0"/>
    <path d="M220 198 q 12 -14 24 0"/>
  </g>
  <path d="M196 216 q 18 28 44 2 q -16 22 -44 -2 z" fill="#E23B2E" stroke="#0A2F8C" stroke-width="4.5" stroke-linejoin="round"/>

  <!-- bowl highlight -->
  <path d="M70 168 C 80 148, 140 148, 150 170" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity=".7"/>
</svg>